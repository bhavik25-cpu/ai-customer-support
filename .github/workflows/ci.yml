name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: server
      - name: Check backend and Vercel API JavaScript syntax
        run: npm run check
        working-directory: server
      - name: Run backend unit tests
        run: npm test
        working-directory: server
      - name: Report dependency audit findings
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:(v.via || []).map(x => typeof x === 'string' ? x : ({name:x.name,title:x.title,range:x.range,url:x.url})),nodes:v.nodes,fixAvailable:v.fixAvailable}));"
          npm audit fix --dry-run --json > audit-fix.json || true
          node -e "const a=require('./audit-fix.json'); console.log(JSON.stringify({added:a.added,removed:a.removed,changed:a.changed,audit:a.audit?.metadata?.vulnerabilities,fixAvailable:a.audit?.vulnerabilities && Object.keys(a.audit.vulnerabilities)}));"
        working-directory: server
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: client
      - run: npm run build
        working-directory: client
