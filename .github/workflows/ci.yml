name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: server
      - name: Check backend and Vercel API JavaScript syntax
        run: npm run check
        working-directory: server
      - name: Run backend unit tests
        run: npm test
        working-directory: server
      - name: Fail on moderate or higher dependency vulnerabilities
        run: npm audit --audit-level=moderate
        working-directory: server
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: client
      - run: npm run build
        working-directory: client
